name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a GitHub release with the APK under this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build the release APK (demo-signed)
        run: ./gradlew --no-daemon assembleRelease
      - name: Checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smt-world-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "SMT World $TAG" \
            --notes-file RELEASE_NOTES.md
